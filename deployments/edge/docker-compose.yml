version: '3.8'

services:
  edge-server:
    build:
      context: ../..
      dockerfile: deployments/edge/Dockerfile
    container_name: igh-edge-server
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      # 必须与 Center 注册的 edge_code 完全一致，否则鉴权第三重校验失败（403）
      - EDGE_ID=${EDGE_ID:-edge-001}
      - DATABASE_PATH=/data/edge.db
      - PORT=8081
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - CENTER_URL=${CENTER_URL:-http://center:8080}
      # 必填。缺失时进程会 log.Fatal 退出，在 restart: unless-stopped 下变成崩溃循环。
      # 获取方式：在 Center 上以管理员用户 JWT 调用
      #   POST /v1/edges/{EDGE_ID}/token
      - CENTER_TOKEN=${CENTER_TOKEN:?CENTER_TOKEN 未设置：请先从 Center 获取设备凭证}
      # 可选，兜底重试间隔，默认 5m；必须为正数（非正值会回退到默认值）
      - SYNC_INTERVAL=${SYNC_INTERVAL:-5m}
    volumes:
      - edge-data:/data
      - ./logs:/app/logs
    networks:
      - igh-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  edge-data:
    driver: local

networks:
  igh-network:
    driver: bridge
